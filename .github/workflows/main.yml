name: Export Azure Resources

on:
  workflow_dispatch: # Manual trigger
  # You can also add `push:` or `schedule:` triggers

env:
  AZURE_SUBSCRIPTIONS: |
    SUBSCRIPTION_ID_1 : e0c12296-7122-4f95-9dbb-ff5b5713273f
    

jobs:
  export-resources:
    runs-on: ubuntu-latest
    name: Export Resources from Subscriptions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          username: ${{ secrets.Azure_USERNAME }}
          password: ${{ secrets.Azure_PASSWORD }}
      - name: Install aztfexport
        run: |
          echo "Installing aztfexport..."
          wget https://github.com/Azure/aztfexport/releases/latest/download/aztfexport-linux-amd64 -O aztfexport
          chmod +x aztfexport
          sudo mv aztfexport /usr/local/bin/

      - name: Export resources from all subscriptions
        run: |
          echo "Starting export process..."
          SUBS=$(echo "$AZURE_SUBSCRIPTIONS" | tr -s '[:space:]' '\n')

          for SUB_ID in $SUBS
          do
            echo "------------------------------------------------"
            echo "Switching to Subscription: $SUB_ID"
            az account set --subscription $SUB_ID || {
              echo "Failed to switch to subscription $SUB_ID"
              continue
            }

            RG_LIST=$(az group list --query "[].name" -o tsv)
            if [ -z "$RG_LIST" ]; then
              echo "No resource groups found in $SUB_ID"
              continue
            fi

            for RG in $RG_LIST
            do
              echo "Exporting Resource Group: $RG from Subscription: $SUB_ID"
              EXPORT_PATH="export/$SUB_ID/$RG"
              mkdir -p "$EXPORT_PATH"

              aztfexport -n resource-group "$RG" -o "$EXPORT_PATH" || {
                echo "Export failed for $RG in $SUB_ID"
                continue
              }
            done
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aztfexport-output
          path: export/
