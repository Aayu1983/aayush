When the pipeline starts, it is triggered manually through workflow_dispatch. The user selects the target environment (uat, sit, production, or drhub) and provides the Terraform working directory. These inputs are passed as GitHub context variables. Before any job runs, GitHub loads all global environment variables declared under env:. Backend values like subscription ID, storage account name, container name, and resource group are fetched from repository‑level secrets, ensuring backend configuration never appears in the code. Deployment authentication variables such as ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID, and ARM_SUBSCRIPTION_ID are loaded from environment‑specific secrets. These variables remain available throughout all jobs in the pipeline, enabling Terraform to authenticate securely without exposing sensitive information.
The first job, called setup, is responsible for determining the correct Git branch from which the Terraform code should be taken. It uses PowerShell logic to check the value of the selected environment. If the environment is production or drhub, it sets the branch to main; otherwise, it sets the branch to the environment name itself (uat or sit). This evaluated branch is stored as job output and later reused by the plan and apply jobs.
Next, the terraform_plan job begins. It checks out the repository code using the exact branch name that was output from the setup job. Immediately after checkout, it captures the exact commit SHA of the code using git rev-parse HEAD and stores this SHA as a job output. This SHA is important because it ensures that the same code used during the plan stage will also be used during the apply stage, preventing any drift caused by new commits. The job then calculates a unique artifact name that represents the plan file, combining environment name and GitHub run ID.
The backend initialization step runs next. Terraform init executes with backend-config parameters sourced from secrets, connecting to the correct Azure storage account, container, and resource group. Since these values come from secrets, the backend details remain fully protected and dynamic. After successful backend initialization, Terraform validate is run to ensure syntax correctness and configuration validity. Terraform then generates a binary plan file named tfplan.binary using terraform plan -out. To give visibility, terraform show is used to generate a human-readable preview of the plan, which is appended to the GitHub job summary so reviewers can examine proposed changes without downloading the binary plan.
Once the plan is ready, it is uploaded as a GitHub artifact using the unique artifact name. This allows the next job to download the exact same tfplan.binary file that was created during the plan stage. At this point, the pipeline waits for manual approval. The await-approval job is mapped to a specific environment called approver, so GitHub Actions automatically pauses the workflow until an authorized approver grants permission to continue. This step ensures governance, security compliance, and human validation before any infrastructure change is actually applied.
After approval is granted, the terraform_apply job begins. Instead of checking out a branch, it checks out using the exact commit SHA that was captured in the plan job. This ensures drift‑free execution because the apply stage will not use any new or updated code that may have been pushed after the plan. Then the job downloads the Terraform plan artifact created earlier and places the tfplan.binary file inside the same working directory used during the plan stage.
Before applying the plan, Terraform init is executed again. This is required because the apply job runs in a fresh runner environment, so Terraform needs to reconnect to the backend and confirm the state location. After backend initialization succeeds, the pipeline looks for tfplan.binary. If it exists, terraform apply -auto-approve is executed with the plan file, guaranteeing that the exact plan generated earlier is used without recalculating anything. If the file does not exist, the pipeline throws an error and stops, preventing accidental or unplanned deployment.
In the end, the pipeline completes the full lifecycle: dynamic branch selection, secure backend initialization, drift‑free SHA‑based plan/apply consistency, strict manual approval, and environment‑specific secret-driven authentication. The execution ensures that deployments are controlled, secure, predictable, and compliant with multi-stage Terraform best practices.
